        <p>O iFood Move 2026 precisava comunicar uma proposta de valor ampla: conteúdo, networking, inovação, palestrantes e oportunidades de negócio.</p>
        <p>Com uma programação extensa e diferentes públicos, o desafio não era apenas apresentar informações — era organizar essa complexidade em uma experiência capaz de conduzir o usuário até a conversão.</p>
        <p class="case__quote">Como transformar um evento com muitas possibilidades em uma jornada digital simples, atrativa e orientada à conversão?</p>
        <p>O evento de 2026 foi projetado para reunir mais de 12 mil participantes, 100+ palestrantes, 70+ horas de conteúdo e 8 palcos simultâneos.</p></section>
        <section class="case"><span class="case__tag">02. A dor</span><h4>Informação demais pode significar decisão de menos</h4>

        <p>Isso cria um problema de UX: quanto maior a quantidade de informações, maior a necessidade de hierarquia, contexto e direcionamento.</p>

        <section class="case"><span class="case__tag">03. A oportunidade</span><h4>Transformar o site de uma página informativa em uma ferramenta de conversão</h4>

        <p>Em vez de simplesmente comunicar: “O iFood Move existe.”</p>
        <p>A experiência deveria responder:</p>
        <p class="case__quote">“Por que este evento é relevante para mim e por que eu deveria participar?”</p>
        <p>A estratégia passou a ser construída em torno de três pilares:</p>

        <p>O próprio posicionamento oficial do evento reforça essa proposta: conectar empreendedores a estratégias, tendências e experiências capazes de transformar conhecimento em resultados.</p></section>
        <section class="case"><span class="case__tag">04. Estratégia de UX</span><h4>Reduzir a distância entre interesse e conversão</h4>
        <p>A arquitetura da experiência foi pensada para trabalhar o usuário progressivamente:</p>
        <p class="case__flow">Descoberta → Interesse → Confiança → Desejo → Conversão</p>
        <dl><dt>01. Descoberta</dt><dd>Apresentar imediatamente o que é o iFood Move e sua relevância.</dd><dt>02. Interesse</dt><dd>Mostrar os conteúdos, experiências e possibilidades disponíveis.</dd><dt>03. Confiança</dt><dd>Utilizar números, palestrantes e informações do evento para fortalecer credibilidade.</dd><dt>04. Desejo</dt><dd>Criar percepção de exclusividade e pertencimento.</dd></dl></section>
        <section class="case"><span class="case__tag">05. A solução</span><h4>Uma experiência digital construída para vender a experiência, não apenas o evento.</h4>
        <p>O site foi estruturado para transformar informações complexas em uma jornada visual e objetiva.</p>
        <dl><dt>Hero</dt><dd>A primeira dobra estabelece rapidamente: o que é → quando acontece → onde acontece → por que importa → como participar. O CTA aparece como elemento de ação, evitando que o usuário precise procurar o próximo passo.</dd>
        <dt>Conteúdo</dt><dd>A informação foi organizada em blocos escaneáveis, permitindo que o usuário compreenda rapidamente a dimensão do evento.</dd>

      en: `<section class="case"><span class="case__tag">01. The challenge</span><h4>Turning a major event into a digital experience that drives action</h4>
        <p>iFood Move 2026 needed to communicate a broad value proposition: content, networking, innovation, speakers and business opportunities.</p>
        <p>With an extensive schedule and different audiences, the challenge wasn't just presenting information — it was organizing that complexity into an experience able to lead users to conversion.</p>
        <p class="case__quote">How do you turn an event with so many possibilities into a simple, appealing, conversion-driven digital journey?</p>
        <p>The 2026 event was designed to bring together more than 12,000 attendees, 100+ speakers, 70+ hours of content and 8 simultaneous stages.</p></section>
        <section class="case"><span class="case__tag">02. The pain point</span><h4>Too much information can mean too little decision</h4>
        <p>Users needed to quickly understand:</p>
        <ul><li>What is iFood Move?</li><li>Why attend?</li><li>What will I find at the event?</li><li>Who will be there?</li><li>What experiences will be available?</li><li>How much does it cost?</li><li>How do I get my ticket?</li></ul>
        <p>On top of that, the event has different audience profiles and interests.</p>
        <p>This creates a UX problem: the more information there is, the greater the need for hierarchy, context and direction.</p>
        <p>The experience had to keep users from simply browsing the content without reaching the main action: <b>getting a ticket.</b></p></section>
        <section class="case"><span class="case__tag">03. The opportunity</span><h4>Turning the site from an informational page into a conversion tool</h4>
        <p>The opportunity was to use the event's own content as the sales argument.</p>
        <p>Instead of simply saying: “iFood Move exists.”</p>
        <p>The experience should answer:</p>
        <p class="case__quote">“Why is this event relevant to me, and why should I attend?”</p>
        <p>The strategy came to be built around three pillars:</p>
        <p class="case__flow">VALUE → PROOF → ACTION</p>
        <dl><dt>Value</dt><dd>Content, trends, networking and opportunities.</dd><dt>Proof</dt><dd>Speakers, event scale, numbers and the brands involved.</dd><dt>Action</dt><dd>Tickets, sponsorship and participation.</dd></dl>
        <p>The event's official positioning reinforces this proposition: connecting entrepreneurs with strategies, trends and experiences that turn knowledge into results.</p></section>
        <section class="case"><span class="case__tag">04. UX strategy</span><h4>Shortening the distance between interest and conversion</h4>
        <p>The architecture of the experience was designed to move users along progressively:</p>
        <p class="case__flow">Discovery → Interest → Trust → Desire → Conversion</p>
        <dl><dt>01. Discovery</dt><dd>Immediately present what iFood Move is and why it matters.</dd><dt>02. Interest</dt><dd>Show the available content, experiences and possibilities.</dd><dt>03. Trust</dt><dd>Use numbers, speakers and event information to build credibility.</dd><dt>04. Desire</dt><dd>Create a sense of exclusivity and belonging.</dd></dl></section>
        <section class="case"><span class="case__tag">05. The solution</span><h4>A digital experience built to sell the experience, not just the event.</h4>
        <p>The site was structured to turn complex information into a visual, objective journey.</p>
        <dl><dt>Hero</dt><dd>The first fold quickly establishes: what it is → when it happens → where it happens → why it matters → how to take part. The CTA appears as an action element, so users don't have to look for the next step.</dd>
        <dt>Content</dt><dd>Information was organized into scannable blocks, letting users quickly grasp the scale of the event.</dd>
        <dt>Speakers</dt><dd>Speakers work not only as information but as proof of value. Relevant names increase the perceived authority of the event.</dd>
        <dt>Schedule</dt><dd>The schedule turns the volume of content into an opportunity: “What am I going to learn?” This helps users find a personal motivation to attend.</dd>
        <dt>Tickets</dt><dd>Presenting the ticket options brings users closer to the final decision, making it clearer what each option includes.</dd></dl></section>
        <video class="case__img" src="img/ifood-move-evento.mp4" poster="img/ifood-move-evento-poster.webp" controls playsinline preload="none" aria-label="Video of the iFood Move website on mobile"></video>
        <section class="case"><span class="case__tag">06. Success Metrics</span>
        <table class="case__metrics"><thead><tr><th scope="col">Metric</th><th scope="col">Results</th></tr></thead><tbody>
        <tr><td>Main CTA click-through rate</td><td>+20%</td></tr>
        <tr><td>Visit → ticket conversion</td><td>+15%</td></tr>
        <tr><td>Drop-off during decision</td><td>-20%</td></tr>
        <tr><td>Schedule interaction</td><td>+25%</td></tr>
        <tr><td>Speaker engagement</td><td>+30%</td></tr></tbody></table></section>
        <section class="case"><span class="case__tag">07. Outcome</span><h4>Design that turns information into decisions.</h4>
        <p>The iFood Move challenge wasn't just presenting an event. It was creating an experience able to communicate scale, spark desire and guide different user profiles toward an action.</p>
        <p>The solution combined UX strategy, information architecture, UI design, visual hierarchy and conversion principles to turn a large amount of content into a clear, engaging, results-driven digital journey.</p></section>`

  {
    title: { pt: "DAKO - Novo e-commerce", en: "DAKO - New e-commerce" },

    tags: ["E-commerce", "UX/UI"], year: "",
    cover: "img/dako-capa.webp", colors: ["#3d2659", "#6a45a0"],

    body: {
      pt: `<section class="case"><p class="case__quote">Dako impulsiona seu e-commerce e aumentou o faturamento em <b>324,84%</b> com estratégias digitais com minha participação como Product Designer na Layer Up.</p></section>
        <section class="case"><span class="case__tag">01. Problema</span>
        <p class="case__lead">As especificações de eletrodomésticos são essenciais para a decisão de compra, mas podem ser apresentadas de forma muito técnica e pouco atrativa.</p>
        <p>O desafio era tornar essas informações mais visuais, compreensíveis e relevantes para o consumidor.</p></section>
        <section class="case"><span class="case__tag">02. Dor</span>
        <p class="case__lead">O usuário precisava interpretar dimensões, peso, capacidade, funcionalidades e características do produto principalmente por meio de informações textuais.</p>
        <p>Isso poderia gerar dificuldade de compreensão e menor percepção dos diferenciais do produto.</p></section>
        <section class="case"><span class="case__tag">03. Oportunidade</span>
        <p class="case__lead">Transformar a área de especificações em uma experiência que não apenas informa, mas também demonstra o produto na prática.</p>
        <p>A oportunidade era aproximar o consumidor do produto mesmo antes da compra.</p></section>
        <section class="case"><span class="case__tag">04. Estratégia</span>
        <p class="case__lead">Utilizei conteúdo visual, hierarquia de informações e elementos interativos para apresentar as características de maneira mais intuitiva.</p></section>
        <section class="case"><span class="case__tag">05. Solução</span>
        <p class="case__lead">Criação de uma apresentação de produto mais interativa, utilizando:</p>
        <ul><li>imagens em diferentes ângulos;</li><li>destaque visual para dimensões;</li><li>informações técnicas organizadas;</li><li>zoom em funcionalidades;</li><li>imagens contextualizando o produto em uso;</li><li>destaque para benefícios e diferenciais.</li></ul>
        <p>Assim, as especificações deixaram de ser apenas uma lista técnica e passaram a fazer parte da experiência de descoberta do produto.</p></section>
        <section class="case"><span class="case__tag">06. Conversão &amp; Impacto</span>
        <p class="case__lead">A solução foi pensada para aproximar informação e decisão de compra, tornando os diferenciais do produto mais fáceis de visualizar e compreender.</p>
        <p><b>Resultados alcançados:</b></p>
        <ul class="case__results"><li><b>↑ +35%</b> na interação com as especificações do produto</li><li><b>↑ +28%</b> no engajamento com imagens e funcionalidades</li><li><b>↑ +20%</b> na compreensão dos diferenciais do produto</li><li><b>↑ +15%</b> na conversão de visualização do produto para intenção de compra</li></ul>
        <div class="case__stats"><div><b>+165,7%</b><span>de crescimento no faturamento de 2023, em comparação a 2022.</span></div><div><b>+59,9%</b><span>de crescimento no faturamento de 2024, comparado ao ano anterior.</span></div></div></section>
        <section class="case"><p class="case__quote">Mais do que apresentar especificações, o projeto transformou informação técnica em uma experiência de produto mais visual, capaz de informar, gerar interesse, interativo e orientado à decisão.</p></section>`,
      en: `<section class="case"><p class="case__quote">Dako boosted its e-commerce and increased revenue by <b>324.84%</b> through digital strategies, with my participation as a Product Designer at Layer Up.</p></section>
        <section class="case"><span class="case__tag">01. Problem</span>
        <p class="case__lead">Appliance specifications are essential to the purchase decision, but they can come across as very technical and unappealing.</p>
        <p>The challenge was to make this information more visual, understandable and relevant to consumers.</p></section>
        <section class="case"><span class="case__tag">02. Pain point</span>
        <p class="case__lead">Users had to interpret dimensions, weight, capacity, features and product characteristics mainly through text.</p>
        <p>This could make the information harder to understand and the product's differentiators less noticeable.</p></section>
        <section class="case"><span class="case__tag">03. Opportunity</span>
        <p class="case__lead">Turning the specifications area into an experience that not only informs but also demonstrates the product in practice.</p>
        <p>The opportunity was to bring consumers closer to the product even before the purchase.</p></section>
        <section class="case"><span class="case__tag">04. Strategy</span>
        <p class="case__lead">I used visual content, information hierarchy and interactive elements to present the product's characteristics more intuitively.</p></section>
        <section class="case"><span class="case__tag">05. Solution</span>
        <p class="case__lead">Creation of a more interactive product presentation, using:</p>
        <ul><li>images from different angles;</li><li>visual emphasis on dimensions;</li><li>organized technical information;</li><li>zoom on features;</li><li>images showing the product in use;</li><li>emphasis on benefits and differentiators.</li></ul>
        <p>This way, specifications stopped being just a technical list and became part of the product discovery experience.</p></section>
        <section class="case"><span class="case__tag">06. Conversion &amp; Impact</span>
        <p class="case__lead">The solution was designed to bring information and purchase decisions closer together, making the product's differentiators easier to see and understand.</p>
        <p><b>Results achieved:</b></p>
        <ul class="case__results"><li><b>↑ +35%</b> in interaction with product specifications</li><li><b>↑ +28%</b> in engagement with images and features</li><li><b>↑ +20%</b> in understanding of product differentiators</li><li><b>↑ +15%</b> in conversion from product view to purchase intent</li></ul>
        <div class="case__stats"><div><b>+165.7%</b><span>revenue growth in 2023 compared to 2022.</span></div><div><b>+59.9%</b><span>revenue growth in 2024 compared to the previous year.</span></div></div></section>
        <section class="case"><p class="case__quote">More than presenting specifications, the project turned technical information into a more visual, interactive, decision-oriented product experience, able to inform and spark interest.</p></section>`

<style>
:root {
  --ink: #0d0b1a; --muted: #4a4568; --lilac: #e7e3fb; --num: #cfc6f6;
  --num-dark: rgba(214,203,255,.55); --violet: #5b3bd1; --pad: clamp(18px, 3.2vw, 46px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: auto; }
body { font-family: "Poppins", system-ui, sans-serif; color: var(--ink); background: var(--lilac); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body.modal-open { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* NAV */
.nav { position: fixed; z-index: 30; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 18px var(--pad) 0; pointer-events: none; }
.nav > * { pointer-events: auto; }
.logo { width: 40px; height: 40px; display: grid; place-items: center; margin-right: clamp(28px,5vw,66px); }
.logo svg { width: 38px; height: 38px; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.logo:hover svg { transform: rotate(90deg); }
.nav__links { display: flex; gap: clamp(22px,4.5vw,58px); font-size: 15.5px; font-weight: 400; }
.nav__links a { position: relative; }
.nav__links a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
.nav__links a:hover::after { transform: scaleX(1); }
.lang { margin-left: auto; margin-right: clamp(18px,2.6vw,40px); display: flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; border: 1.5px solid currentColor; border-radius: 99px; padding: 3px; }
.lang button { padding: 4px 10px; border-radius: 99px; letter-spacing: .04em; opacity: .55; transition: opacity .3s, background .3s, color .3s; }
.lang button[aria-pressed="true"] { opacity: 1; background: var(--ink); color: var(--lilac); }
body.on-dark .lang button[aria-pressed="true"] { background: #fff; color: #2a1670; }
.nav__cta { font-weight: 600; font-size: 16px; padding-right: clamp(0px,4vw,70px); white-space: nowrap; }
.nav, .badge { transition: color .5s ease; }
body.on-dark .nav, body.on-dark .badge { color: #fff; }
/* liquid glass behind the nav once the page is scrolled, so the links stay readable over content */
.nav::before { content: ""; position: absolute; z-index: -1; top: 8px; bottom: -8px; left: calc(var(--pad) - 16px); right: calc(var(--pad) - 16px); border-radius: 99px; pointer-events: none;
  background: linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.22) 100%);
  border: 1px solid rgba(255,255,255,.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25), 0 14px 34px -18px rgba(50,20,130,.35);
  -webkit-backdrop-filter: blur(18px) saturate(1.8); backdrop-filter: blur(18px) saturate(1.8);
  opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .4s ease, transform .4s cubic-bezier(.2,.8,.2,1), background .5s ease, border-color .5s ease; }
.nav.is-scrolled::before { opacity: 1; transform: none; }
body.on-dark .nav::before { background: linear-gradient(160deg, rgba(40,22,110,.5) 0%, rgba(20,10,60,.3) 100%); border-color: rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 14px 34px -18px rgba(0,0,0,.5); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .nav::before { background: rgba(240,236,255,.94); }
  body.on-dark .nav::before { background: rgba(28,16,80,.92); }
}
@media (prefers-reduced-transparency: reduce) {
  .nav::before { background: rgba(240,236,255,.97); -webkit-backdrop-filter: none; backdrop-filter: none; }
  body.on-dark .nav::before { background: rgba(28,16,80,.96); }
}
@media (prefers-reduced-motion: reduce) { .nav::before { transform: none; } }

/* BADGE */
.badge { position: fixed; z-index: 30; right: var(--pad); bottom: 22px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 500; line-height: 1; color: #2b2550; }
.badge__text { white-space: nowrap; }
.badge b { font-weight: 700; color: var(--violet); }
body.on-dark .badge b { color: #d9ccff; }
.badge svg { width: 20px; height: 20px; }

/* BUTTERFLY */
#butterfly { position: fixed; inset: 0; z-index: 20; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
#butterfly.ready { opacity: 1; }

/* SECTIONS */
section { position: relative; min-height: 100vh; height: 100vh; overflow: hidden; }
.flower { position: absolute; pointer-events: none; user-select: none; will-change: transform; }

/* HERO */
.hero { background: #e4e0fa url(img/fundo-topo.webp) center/cover no-repeat; overflow: visible; z-index: 3; }
.hero__eyebrow { position: absolute; left: 50%; top: calc(21vh - 66px); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 14px; border-radius: 99px; background: rgba(255,255,255,.45); backdrop-filter: blur(8px); white-space: nowrap; z-index: 2; opacity: 0; }
.hero__eyebrow i { position: relative; flex: none; width: 7px; height: 7px; border-radius: 50%; background: #3cc47c; box-shadow: 0 0 0 4px rgba(60,196,124,.2); }
.loaded .hero__eyebrow { animation: fadeC 1s .2s ease forwards; }
/* interactive: pulsing "online" dot; on hover it lifts, fills with the gradient and reveals an arrow (links to Contato) */
.hero__eyebrow { isolation: isolate; overflow: hidden; cursor: pointer; transition: translate .35s cubic-bezier(.2,.8,.2,1), color .35s, box-shadow .35s; }
.hero__eyebrow::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--btn-grad, #5b3bd1); opacity: 0; transition: opacity .35s; }
.hero__eyebrow i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #3cc47c; animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
@keyframes ping { 75%, 100% { transform: scale(2.8); opacity: 0; } }
.eb-arrow { width: 0; height: 9px; margin-left: -8px; opacity: 0; transition: width .35s, margin .35s, opacity .35s, transform .35s; }
.hero__eyebrow:hover { translate: 0 -2px; color: #fff; box-shadow: 0 10px 24px -12px rgba(91,59,209,.7); }
.hero__eyebrow:hover::before { opacity: 1; }
.hero__eyebrow:hover .eb-arrow { width: 9px; margin-left: 0; opacity: 1; }
.hero__eyebrow:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
@keyframes fadeC { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.hero h1 { position: absolute; left: 0; right: 0; top: 21vh; text-align: center; font-weight: 800; font-size: clamp(42px, 6.25vw, 112px); line-height: 1.04; letter-spacing: -.035em; color: var(--ink); text-shadow: 0 0 40px rgba(255,255,255,.35); will-change: transform; z-index: 2; }
.hero h1 .line { display: block; overflow: hidden; padding-bottom: .06em; }
.hero h1 .line span { display: inline-block; transform: translateY(110%); }
.loaded .hero h1 .line span { animation: rise 1.1s cubic-bezier(.2,.8,.15,1) forwards; }
.hero h1 .line:nth-child(2) span { animation-delay: .12s; }
@keyframes rise { to { transform: translateY(0); } }
/* call-to-action centred under the headline (2 lines of h1 ≈ 2.2em) */
.hero__cta { position: absolute; left: 50%; top: calc(21vh + 2.2 * clamp(42px, 6.25vw, 112px) + 30px); margin: 0; z-index: 2; opacity: 0; transform: translateX(-50%); }
.loaded .hero__cta { animation: fadeC 1s .6s ease forwards; }
/* simple outline pill; fills in on hover */
.join.hero__cta { flex-direction: row-reverse; gap: 10px; padding: 12px 24px; border: 1px solid var(--ink); border-radius: 999px; font-size: 15px; font-weight: 500; transition: background .3s, color .3s; }
.join.hero__cta i { width: auto; height: auto; border: 0; border-radius: 0; transition: transform .3s; }
.join.hero__cta i svg { width: 9px; height: 9px; }
.join.hero__cta:hover { background: var(--ink); color: #fff; }
.join.hero__cta:hover i { transform: translateX(3px); }
.hero__cta:focus-visible { outline: 2px solid var(--violet); outline-offset: 4px; }
@keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
/* Portrait: arch-shaped photo with a fine halo line and a rotating seal */
/* Portrait: just the photo, softly rounded, with a quiet caption */
.portrait__arch { position: relative; }
.portrait__frame { position: relative; height: min(36vh, 325px); border-radius: 24px; overflow: hidden; background: #efeafd; box-shadow: 0 24px 48px -28px rgba(60,30,140,.35); }
.portrait__frame img, .portrait__frame span { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; display: grid; place-items: center; font-size: 56px; font-weight: 700; color: var(--violet); letter-spacing: -.03em; }
.portrait__cap { margin-top: 18px; }
.portrait__cap strong { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.portrait__cap small { display: block; margin-top: 3px; font-size: 14px; font-weight: 400; color: var(--muted); }
.join { display: inline-flex; align-items: center; gap: 14px; margin-top: 40px; font-weight: 600; font-size: clamp(15px,1.4vw,19px); }
.join i { width: 25px; height: 32px; border: 1.8px solid currentColor; border-radius: 10px; display: grid; place-items: center; transition: transform .35s ease, background .35s; }
.join i svg { width: 9px; height: 9px; }
.join:hover i { transform: translateX(4px); }
.hero .flower--cosmos { width: clamp(420px,64vw,1100px); left: -14vw; bottom: -24vw; transform-origin: 60% 40%; filter: drop-shadow(0 30px 40px rgba(80,50,160,.18)); z-index: 1; }

/* SHARED TYPE */
.num { font-weight: 600; line-height: .8; letter-spacing: -.06em; font-size: clamp(110px,15vw,250px); color: var(--num); }
.title { font-weight: 700; font-size: clamp(30px,3.4vw,56px); line-height: 1.12; letter-spacing: -.02em; }
.copy { margin-top: 22px; font-size: clamp(13.5px,1.05vw,16px); line-height: 1.6; color: var(--muted); max-width: 420px; }
.reveal { opacity: 0; transform: translateY(40px); transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.15,1); }
.in .reveal { opacity: 1; transform: none; }
.in .reveal.d1 { transition-delay: .1s; }
.in .reveal.d2 { transition-delay: .22s; }
.in .reveal.d3 { transition-delay: .34s; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; max-width: 460px; padding-top: 22px; border-top: 1px solid rgba(91,59,209,.18); }
.chips span { font-size: 12px; font-weight: 500; letter-spacing: .02em; padding: 6px 13px; border-radius: 99px; border: 1px solid rgba(91,59,209,.28); color: #3d2a8f; background: rgba(255,255,255,.35); transition: background .3s, color .3s; }
.chips span:hover { background: var(--violet); color: #fff; }
.eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--violet); }
.eyebrow::before { content: ""; width: 34px; height: 1px; background: currentColor; }
.sign { margin-top: 18px; font-family: "Mrs Saint Delafield", cursive; font-size: clamp(44px,4vw,62px); line-height: 1; color: var(--violet); transform-origin: left; }
.sign span { display: inline-block; transform: rotate(-4deg); }

/* 01 — SOBRE */
.s1 { background: linear-gradient(180deg, #e4e0fa 0%, #ece9fc 100%); z-index: 2; }
.s1 .flower--hang { width: clamp(380px,46vw,820px); left: -9vw; top: -14vw; transform-origin: 50% 0%; }
.s1 .num { position: absolute; left: 6vw; top: 50vh; }
.s1 .me { position: absolute; left: 24vw; top: 50%; transform: translateY(-50%); width: min(290px, 21vw); z-index: 2; }
.s1 .portrait__frame { height: min(44vh, 390px); }
.me__note { margin-top: 14px; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
.s1 .text { position: absolute; left: 50vw; top: 50%; transform: translateY(-46%); width: min(520px,44vw); }

/* EMPRESAS — faixas de logos passando na horizontal */
/* Text and logo rows sit in normal flow with a fixed gap, so they never touch on short screens. */
.clients { background: linear-gradient(180deg, #ece9fc 0%, #e6e1fb 100%); z-index: 2; height: auto; display: flex; flex-direction: column; justify-content: center; gap: clamp(56px, 10vh, 120px); padding: 16vh 0 12vh; }
.clients .text { position: relative; margin-left: 6vw; width: min(560px,46vw); z-index: 2; }
.wall { position: relative; display: flex; flex-direction: column; gap: 6px; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%); }
.wall__row { position: relative; z-index: 1; overflow: hidden; padding: 6px 0 12px; }
.wall__track { display: flex; gap: 12px; width: max-content; animation: wallSlide var(--dur, 55s) linear infinite; }
.wall__row:nth-child(2) .wall__track { --dur: 62s; animation-direction: reverse; }
.wall:hover .wall__track { animation-play-state: paused; }
@keyframes wallSlide { to { transform: translateX(calc(-100% / 3 - 4px)); } } /* one of three copies + its gap */
.logo-card { --logo-h: 24px; flex: none; width: 140px; height: 60px; display: grid; place-items: center; padding: 0 16px; text-align: center; border-radius: 16px; font-size: 13px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; color: #4a4170;
  /* liquid glass, kept subtle: faint fill, soft blur, hairline rim, gentle top highlight */
  position: relative; overflow: hidden; isolation: isolate;
  background: linear-gradient(160deg, rgba(255,255,255,.32) 0%, rgba(255,255,255,.12) 100%);
  backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  border: .5px solid rgba(255,255,255,.7);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 8px 24px -18px rgba(50,20,130,.28);
  transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s, color .35s, background .5s; }
.logo-card::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: radial-gradient(110% 60% at 25% -15%, rgba(255,255,255,.4), rgba(255,255,255,0) 60%); }
.logo-card::after { content: ""; position: absolute; top: -60%; left: -70%; width: 40%; height: 220%; z-index: -1; pointer-events: none; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.32), rgba(255,255,255,0)); transform: rotate(18deg); transition: left 1.1s cubic-bezier(.2,.8,.2,1); }
.logo-card:hover { transform: translateY(-2px); color: var(--violet); background: linear-gradient(160deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.2) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 12px 28px -18px rgba(50,20,130,.32); }
.logo-card:hover::after { left: 130%; }
/* every logo covers the same visual area (sized in JS from its proportions), so wide and square logos look equal */
.logo-card img { display: block; width: calc(var(--lw, 90) * var(--ls, 1) * 1px); height: calc(var(--lh, 24) * var(--ls, 1) * 1px); object-fit: contain; filter: grayscale(1) opacity(.55); transition: filter .35s; }
.logo-card:hover img { filter: none; }
@media (prefers-reduced-motion: reduce) { .wall__track { animation: none; } }

/* 02 — PROJETOS (escuro, altura livre) */
.s2 { background: #3a1f8c; color: #fff; z-index: 3; height: auto; padding: 22vh 6vw 34vh; overflow: clip; } /* clip, not hidden, so the sticky background works */
/* the background stays at viewport size while the tall section scrolls, instead of being stretched */
.s2__bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.s2__bg > div { position: sticky; top: 0; height: 100vh; background: url(img/fundo-projetos-hd.webp) center/cover no-repeat; }
.s2::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(25,10,70,.45) 0%, rgba(25,10,70,0) 55%); }
.s2 .num { color: var(--num-dark); position: relative; }
.s2 .text { position: relative; z-index: 3; width: min(560px,60vw); }
.s2 .title { margin-top: 22px; }
.s2 .copy { color: rgba(240,234,255,.82); }
.s2 .flower--iris { width: clamp(380px,46vw,820px); right: -8vw; bottom: -20vw; transform-origin: 30% 30%; filter: drop-shadow(0 40px 60px rgba(20,0,60,.45)); z-index: 2; }
/* "Ver mais projetos": light outline pill centred under the cards */
.more { position: relative; z-index: 3; max-width: 62vw; display: flex; justify-content: center; margin-top: 48px; }
.more .join { margin: 0; flex-direction: row-reverse; gap: 10px; padding: 13px 26px; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; font-size: 15px; font-weight: 500; color: #fff; transition: background .3s, color .3s, border-color .3s; }
.more .join i { width: auto; height: auto; border: 0; border-radius: 0; transition: transform .3s; }
.more .join i svg { width: 9px; height: 9px; }
.more .join:hover { background: #fff; color: #2a1670; border-color: #fff; }
.more .join:hover i { transform: translateX(3px); }
.more .join:focus-visible { outline: 2px solid #d9ccff; outline-offset: 4px; }
.grid { position: relative; z-index: 3; margin-top: 64px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 26px; max-width: 62vw; }
.card { display: block; width: 100%; text-align: left; padding: 12px; border-radius: 24px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); opacity: 0; transform: translateY(40px); transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.15,1), background .35s, border-color .35s; }
.card.in { opacity: 1; transform: none; }
.card.in:hover { transform: translateY(-6px); background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); }
.card:focus-visible { outline: 2px solid #d9ccff; outline-offset: 4px; }
.card__cover { position: relative; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; background-size: cover; background-position: center; display: grid; place-items: center; }
.card__cover em { font-style: normal; font-size: clamp(54px,6vw,96px); font-weight: 800; letter-spacing: -.06em; color: rgba(255,255,255,.28); transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.card.in:hover .card__cover em { transform: scale(1.08) rotate(-3deg); }
.card__lock { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 99px; background: rgba(13,11,26,.55); backdrop-filter: blur(8px); color: #fff; }
.card__lock svg { width: 12px; height: 12px; }
.card__body { padding: 18px 8px 8px; }
.card__meta { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: rgba(240,234,255,.6); font-weight: 500; }
.card__meta span:last-child { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-weight: 600; }
.card__meta svg { width: 9px; height: 9px; transition: transform .35s; }
.card.in:hover .card__meta svg { transform: translateX(4px); }
.card h3 { margin-top: 8px; font-size: clamp(18px,1.5vw,22px); font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.card p { margin-top: 6px; font-size: 14px; line-height: 1.5; color: rgba(240,234,255,.75); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tags span { font-size: 11.5px; font-weight: 500; padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,.22); }

/* 03 — PROCESSO */
.s3 { background: linear-gradient(180deg, #ece9fc 0%, #e7e3fb 100%); z-index: 1; }
.s3 .flower--passion { width: clamp(360px,42vw,760px); left: -10vw; top: 6vh; transform-origin: 40% 50%; }
/* centred vertically (below the nav) so the last row of steps is never clipped on short screens */
.s3 .text { position: absolute; left: 54vw; top: calc(50% + 30px); transform: translateY(-50%); width: min(500px,40vw); }
.s3 .num { font-size: clamp(90px, min(15vw, 24vh), 250px); }
.s3 .title { margin-top: 24px; }
.steps { list-style: none; margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; }
.steps li { font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.steps b { display: block; font-size: 15.5px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.steps b small { font-size: 11.5px; font-weight: 600; color: var(--violet); margin-right: 6px; }

/* FOOTER */
.foot { background: #e7e3fb; height: 100vh; z-index: 1; }
.foot .brand { position: absolute; left: var(--pad); bottom: 80px; }
.foot .brand strong { display: block; font-size: clamp(30px,3vw,46px); font-weight: 700; letter-spacing: -.02em; }
.foot .brand span { font-size: 14px; color: var(--muted); }
.foot .cols { position: absolute; right: calc(var(--pad) + 120px); bottom: 80px; display: flex; gap: 64px; font-size: 14.5px; font-weight: 500; }
.foot .cols > div { display: flex; gap: 32px; }
.foot .cols a { display: block; line-height: 1.9; }
.foot .cols a:hover { color: var(--violet); }.foot .cta { position: absolute; left: 50%; top: 18vh; transform: translateX(-50%); text-align: center; width: min(900px, 92vw); }
.foot .cta .title { font-size: clamp(30px,3.6vw,60px); }
/* contact actions side by side, vertically centred */
.cta__row { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 30px; }
.foot .cta .join { margin: 0; flex-direction: row-reverse; gap: 10px; padding: 12px 24px; border: 1px solid var(--ink); border-radius: 999px; font-size: 15px; font-weight: 500; transition: background .3s, color .3s; }
.foot .cta .join i { width: auto; height: auto; border: 0; border-radius: 0; transition: transform .3s; }
.foot .cta .join i svg { width: 9px; height: 9px; }
.foot .cta .join:hover { background: var(--ink); color: #fff; }
.foot .cta .join:hover i { transform: translateX(3px); }
/* MODAL */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; visibility: hidden; opacity: 0; transition: opacity .35s ease, visibility .35s; }
.modal.open { visibility: visible; opacity: 1; }
.modal__backdrop { position: absolute; inset: 0; background: rgba(13,11,26,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.modal__card { position: relative; width: min(640px,100%); max-height: calc(100vh - 40px); overflow: auto; background: #f6f4fe; border-radius: 28px; box-shadow: 0 40px 100px rgba(20,0,60,.4); transform: translateY(24px) scale(.98); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.modal.open .modal__card { transform: none; }
.modal__close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.85); display: grid; place-items: center; transition: transform .35s; }
.modal__close:hover { transform: rotate(90deg); }
.modal__close svg { width: 14px; height: 14px; }
.modal__cover { aspect-ratio: 16/7; background-size: cover; background-position: center; display: grid; place-items: center; }
.modal__cover em { font-style: normal; font-size: 110px; font-weight: 800; letter-spacing: -.06em; color: rgba(255,255,255,.3); }
.modal__body { --mx: clamp(22px,4vw,36px); padding: 28px var(--mx) 34px; }
.modal__body .card__meta, .modal__body .card__meta span:last-child { color: var(--muted); font-weight: 500; }
.modal__body h3 { margin-top: 6px; font-size: clamp(24px,2.4vw,32px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.modal__body .tags span { border-color: #d6cff5; color: var(--violet); }
.modal__text { margin-top: 20px; font-size: 15px; line-height: 1.65; color: var(--muted); }
.modal__text p + p { margin-top: 12px; }
.modal__text b { color: var(--ink); font-weight: 600; }
.modal__card--wide { width: min(1180px,100%); }
.modal__card--wide .modal__body { --mx: clamp(22px,6vw,88px); padding-top: 40px; padding-bottom: 56px; }
.modal__cover--img { aspect-ratio: auto; display: block; }
.modal__cover--img img, .case-loop { display: block; width: 100%; height: auto; background: #2a1650; }
/* long case studies */
.case { min-height: 0; height: auto; overflow: visible; padding-top: 32px; }
.case + .case { margin-top: 32px; border-top: 1px solid rgba(91,59,209,.15); }
.case__tag { display: block; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); }
.case h4 { margin: 10px 0 16px; font-size: clamp(20px,2vw,25px); font-weight: 700; line-height: 1.25; letter-spacing: -.015em; color: var(--ink); }
.case__tag + .case__lead { margin-top: 10px; }
.case ul.case__results { list-style: none; padding-left: 0; }
.case__stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 22px; }
.case__stats > div { padding: 20px 22px; border-radius: 16px; background: rgba(91,59,209,.07); }
.case__stats b { display: block; font-size: clamp(30px,3.6vw,44px); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; color: var(--violet); }
.case__stats span { display: block; margin-top: 6px; font-size: 13.5px; line-height: 1.45; }
@media (max-width: 520px) { .case__stats { grid-template-columns: 1fr; } }
.case ul { margin: 12px 0; padding-left: 20px; }
.case li + li { margin-top: 4px; }
.case__quote { margin: 18px 0; padding-left: 16px; border-left: 2px solid var(--violet); font-size: 17px; font-weight: 500; line-height: 1.45; color: var(--ink); }
.case__flow { margin: 18px 0; font-size: 14px; font-weight: 600; letter-spacing: .02em; color: var(--violet); }
.case dl { margin: 16px 0; }
.case dt { margin-top: 14px; font-weight: 600; color: var(--ink); }
.case dd { margin: 2px 0 0; }
/* full-bleed image inside the case (cancels the modal body's side padding) */
.case__img { display: block; margin: 40px calc(-1 * var(--mx)) 0; width: calc(100% + 2 * var(--mx)); max-width: none; height: auto; }
.case-video { width: 100%; aspect-ratio: 16/9; background: #1a0b3d; }
.case-video video { display: block; width: 100%; height: 100%; }
.case-video__play { position: relative; display: grid; place-items: center; align-content: center; gap: 12px; width: 100%; height: 100%; background: center/cover no-repeat; color: #fff; font-size: 14px; font-weight: 500; }
.case-video__play::before { content: ""; position: absolute; inset: 0; background: rgba(20,8,50,.45); transition: background .3s; }
.case-video__play:hover::before { background: rgba(20,8,50,.28); }
.case-video__play > * { position: relative; }
.case-video__play i { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.95); }
.case-video__play i::after { content: ""; position: absolute; left: 26px; top: 20px; border-style: solid; border-width: 12px 0 12px 19px; border-color: transparent transparent transparent #5b3bd1; }
.case-video__play[disabled] { cursor: progress; }
.case-video__play[disabled] i { display: none; }
.case__metrics { width: 100%; margin-top: 16px; border-collapse: collapse; }
.case__metrics th { padding: 0 0 10px; text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); border-bottom: 1px solid rgba(91,59,209,.25); }
.case__metrics th:last-child, .case__metrics td:last-child { text-align: right; }
.case__metrics td { padding: 14px 0; color: var(--ink); border-bottom: 1px solid rgba(91,59,209,.12); }
.case__metrics td:last-child { font-size: clamp(20px,2.2vw,26px); font-weight: 700; letter-spacing: -.02em; color: var(--violet); white-space: nowrap; padding-left: 16px; }
.lockbox { margin-top: 22px; padding: 22px; border-radius: 20px; background: #fff; border: 1px solid #e2dcfa; }
.lockbox h4 { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
.lockbox h4 svg { width: 16px; height: 16px; color: var(--violet); }
.lockbox p { margin-top: 6px; font-size: 14px; line-height: 1.55; color: var(--muted); }
.pw { display: flex; gap: 10px; margin-top: 16px; }
.pw input { flex: 1; min-width: 0; height: 50px; border-radius: 14px; border: 1.5px solid #d6cff5; padding: 0 16px; font: inherit; font-size: 15px; background: #faf9ff; color: var(--ink); outline: none; transition: border-color .25s, box-shadow .25s; }
.pw input:focus { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(91,59,209,.12); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 22px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600; font-size: 15px; transition: background .3s, transform .3s; }
.btn:hover { background: var(--violet); }
.btn[disabled] { opacity: .6; pointer-events: none; }
.btn svg { width: 9px; height: 9px; }
.err { min-height: 20px; margin-top: 10px; font-size: 13px; color: #c4245a; }
.hint { font-size: 13px; color: var(--muted); }
.hint a { color: var(--violet); font-weight: 600; }
.shake { animation: shake .45s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.modal__actions { margin-top: 26px; }

/* TESTE — hover com degradê em todos os botões. Para voltar ao hover anterior, apague este bloco inteiro. */
:root { --btn-grad: linear-gradient(120deg, #5b3bd1 0%, #8f5cff 45%, #e07ad8 100%); }
.join.hero__cta, .foot .cta .join, .more .join, .btn, .chips span { position: relative; isolation: isolate; overflow: hidden; }
.join.hero__cta::before, .foot .cta .join::before, .more .join::before, .btn::before, .chips span::before {
  content: ""; position: absolute; inset: -1px; z-index: -1; border-radius: inherit; pointer-events: none;
  background: var(--btn-grad); opacity: 0; transition: opacity .4s ease; }
.join.hero__cta:hover, .foot .cta .join:hover, .more .join:hover, .btn:hover, .chips span:hover { background: transparent; color: #fff; border-color: transparent; }
.join.hero__cta:hover::before, .foot .cta .join:hover::before, .more .join:hover::before, .btn:hover::before, .chips span:hover::before { opacity: 1; }

/* LOADER */
.loader { position: fixed; inset: 0; z-index: 50; background: var(--lilac); display: grid; place-items: center; transition: opacity .8s ease, visibility .8s; }
.loader.done { opacity: 0; visibility: hidden; }
.loader svg { width: 46px; height: 46px; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (min-width: 761px) and (max-width: 1100px) {
  .hero h1 { text-align: left; padding-left: 6vw; }
  .hero__eyebrow { left: 6vw; transform: none; }
  .loaded .hero__eyebrow { animation: fade 1s .2s ease forwards; }
  .hero__cta { left: 6vw; transform: none; }
  .loaded .hero__cta { animation: fade 1s .6s ease forwards; }
  .s1 .portrait__frame { height: min(36vh, 300px); }
}
@media (max-width: 760px) {
  .nav__links { display: none; }
  .logo { margin-right: 0; }
  .nav__cta { font-size: 14.5px; padding-right: 0; }
  .lang { margin-right: 16px; }
  .badge { display: none; }
  .hero__eyebrow { top: calc(20vh - 58px); font-size: 12px; }
  .hero h1 { top: 20vh; }
  .hero__cta { top: calc(20vh + 2.2 * 42px + 24px); }
  /* Sobre mim on phones: photo + note, then the text, in normal flow */
  .s1 { height: auto; min-height: 100vh; display: flex; flex-direction: column; gap: 40px; padding: 30vh 18px 10vh; }
  .s1 .me, .s1 .text { position: relative; left: auto; right: auto; top: auto; bottom: auto; width: auto; transform: none; }
  .portrait { display: flex; align-items: flex-end; gap: 20px; }
  .portrait__arch { width: 38vw; flex: none; }
  .s1 .portrait__frame { height: 48vw; border-radius: 18px; }
  .portrait__cap { margin: 0 0 4px; }
  .portrait__cap strong { font-size: 17px; }
  .portrait__cap small { font-size: 12.5px; white-space: nowrap; }
  .me__note { font-size: 14px; }
  .s1 .flower--hang { width: 86vw; left: -12vw; top: -24vw; }
  .s1 .chips { padding-top: 14px; margin-top: 16px; }
  .sign { margin-top: 10px; font-size: 40px; }

const store = {

    let h = Math.sqrt(1600 / r) * k, w = h * r;
    if (w > 104) { w = 104; h = w / r; }

/* ---------- password-protected cases (AES-GCM, key from PBKDF2) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(blob, pw) {
  const [salt, iv, ct] = blob.split(".").map(b64);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct)));
}

const modal = document.getElementById("modal"), mCover = document.getElementById("mCover"), mBody = document.getElementById("mBody");
let current = null, lastFocus = null;
function renderModal() {
  const i = current, p = PROJECTS[i];

  const topVideo = p.locked && data && data.video;

    : p.loop ? `<video class="case-loop" autoplay muted loop playsinline preload="auto" aria-label="${esc(p.title[lang])}" style="aspect-ratio:${p.loopRatio}"><source src="${esc(p.loop)}" type="video/webm"></video>`
    : p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title[lang])}">` : p.cover ? "" : `<em>${mono(p)}</em>`;
  const loopVideo = mCover.querySelector(".case-loop");
  if (loopVideo) loopVideo.querySelector("source").onerror = () => { loopVideo.outerHTML = `<img src="${esc(p.loopFallback)}" alt="${esc(p.title[lang])}" style="aspect-ratio:${p.loopRatio}">`; };
  let html = `
    <div class="card__meta"><span>${esc(p.year)}</span></div>
    <h3 id="mTitle">${esc(p.title[lang])}</h3>
    <div class="tags">${p.tags.map(x => `<span>${esc(x)}</span>`).join("")}</div>`;
  if (data) {
    html += `<div class="modal__text">${data.body[lang]}</div>`;
    if (data.link) html += `<div class="modal__actions"><a class="btn" href="${esc(data.link)}" target="_blank" rel="noopener">${t("modal.view")}${CHEV}</a></div>`;
  } else {
    html += `
      <div class="modal__text"><p>${esc(p.summary[lang])}</p></div>
      <form class="lockbox" id="pwForm" autocomplete="off">
        <h4>${LOCK}${t("modal.lockedTitle")}</h4>
        <p>${t("modal.lockedText")}</p>
        <div class="pw">
          <input type="password" id="pwInput" placeholder="${t("modal.placeholder")}" aria-label="${t("modal.placeholder")}" required>
          <button class="btn" type="submit">${t("modal.unlock")}</button>
        </div>
        <div class="err" id="pwErr" role="alert"></div>
        <div class="hint">${t("modal.ask")} <a href="${esc(whatsapp(t("wa.password") + " " + p.title[lang] + "."))}" target="_blank" rel="noopener">${t("modal.askLink")}</a></div>
      </form>`;
  }
  mBody.innerHTML = html;
  if (topVideo) mountVideo(topVideo);
  const form = document.getElementById("pwForm");
  if (form) form.addEventListener("submit", async e => {
    e.preventDefault();
    const input = document.getElementById("pwInput"), btn = form.querySelector("button");
    btn.disabled = true;
    try {
      const res = await decrypt(p.locked, input.value);
      unlocked[i] = res; store.sset("case-" + p.locked.slice(0, 24), JSON.stringify(res)); // keyed to this content, so a re-encrypted case asks again
      renderModal(); renderGrid();
    } catch {
      btn.disabled = false;
      document.getElementById("pwErr").textContent = window.crypto && crypto.subtle ? t("modal.wrong") : t("modal.insecure");
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      input.select();
    }
  });
}
/* Protected video: an encrypted file, downloaded only when the viewer presses play. Its key lives
   inside the password-protected case data, so the file is useless without the password. */
const videoCache = {}; // decrypted video URLs, kept so a language switch doesn't download it again
const toBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function mountVideo(video) {
  const box = mCover.querySelector(".case-video");
  if (!box || !video) return;
  const player = url => { box.innerHTML = `<video src="${url}" controls playsinline preload="metadata" poster="${video.poster}"></video>`; return box.firstChild; };
  if (videoCache[video.src]) return void player(videoCache[video.src]);
  box.innerHTML = `<button class="case-video__play" type="button" style="background-image:url('${video.poster}')"><i aria-hidden="true"></i><span>${t("video.play")} · ${video.mb} MB</span></button>`;
  box.firstChild.addEventListener("click", async () => {
    const btn = box.firstChild, label = btn.querySelector("span");
    btn.disabled = true; label.textContent = t("video.loading");
    try {
      const res = await fetch(video.src);
      if (!res.ok) throw new Error(res.status);
      const total = +res.headers.get("content-length") || 0, reader = res.body.getReader(), parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (total) label.textContent = `${t("video.loading")} ${Math.round(got / total * 100)}%`;
      }
      const key = await crypto.subtle.importKey("raw", toBytes(video.key), "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: toBytes(video.iv) }, key, await new Blob(parts).arrayBuffer());
      videoCache[video.src] = URL.createObjectURL(new Blob([plain], { type: video.type }));
      if (box.isConnected) player(videoCache[video.src]).play().catch(() => {});
    } catch {
      btn.disabled = false; label.textContent = t("video.error");
    }
  });
}
function openModal(i) {
  current = i; lastFocus = document.activeElement;
  renderModal();
  modal.classList.add("open"); modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  mBody.parentElement.scrollTop = 0;
  setTimeout(() => (document.getElementById("pwInput") || modal.querySelector(".modal__close")).focus(), 60);
}
function closeModal() {
  if (current === null) return;
  current = null;
  modal.querySelectorAll("video").forEach(v => v.pause()); // no sound left playing behind a closed window
  modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  if (lastFocus) lastFocus.focus({ preventScroll: true });
}
modal.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", closeModal));
addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

applyLang();

/* ---------- 5a. DOM scroll effects ---------- */
const sections = [...document.querySelectorAll("main > section")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting && (e.intersectionRatio >= .3 || e.intersectionRect.height >= innerHeight * .3)) e.target.classList.add("in");
}), { threshold: [0, .1, .2, .3] });
sections.forEach(s => io.observe(s));

const parallax = [...document.querySelectorAll("[data-speed]")];
const nav = document.querySelector(".nav");
function onScroll() {
  for (const el of parallax) {
    const sec = el.closest("section");
    const p = -sec.getBoundingClientRect().top / innerHeight;
    const speed = parseFloat(el.dataset.speed), rot = parseFloat(el.dataset.rot || 0);
    el.style.transform = `translate3d(0,${p * speed * innerHeight}px,0) rotate(${p * rot}deg)`;
  }
  const y = innerHeight * .06;
  const active = sections.find(s => { const r = s.getBoundingClientRect(); return r.top <= y && r.bottom > y; });
  document.body.classList.toggle("on-dark", !!active && active.dataset.theme === "dark");
  nav.classList.toggle("is-scrolled", scrollY > 24);
}
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", onScroll);
onScroll();

/* ---------- 5b. Loader ---------- */
const loader = document.getElementById("loader"), canvas = document.getElementById("butterfly");
const reveal = () => { loader.classList.add("done"); document.body.classList.add("loaded"); };
setTimeout(reveal, 2500);

/* ---------- 5c. three.js scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .1, 100);
camera.position.set(0, 0, 10);
function resize() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

scene.add(new THREE.HemisphereLight(0xf2eeff, 0x7a62c9, 1.3));
const key = new THREE.DirectionalLight(0xfff1d6, 2.6); key.position.set(3, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xc8b8ff, 2.2); rim.position.set(-5, 2, -4); scene.add(rim);

/* Hierarchy: flight (position, scale) > tilt (leans the wings' top side toward the camera)
   > heading (yaw) > body (roll/pitch). Body frame: +X = head, +Y = up, +Z = right side. */
const flight = new THREE.Group(), tilt = new THREE.Group(), heading = new THREE.Group(), body = new THREE.Group();
tilt.rotation.x = .8;
flight.add(tilt); tilt.add(heading); heading.add(body); scene.add(flight);

/* ---------- 5d. procedural butterfly ---------- */
/* Wing outlines in (outward, forward) units; the root sits at the origin. */
const foreShape = new THREE.Shape();
foreShape.moveTo(0, .05);
foreShape.bezierCurveTo(.2, .17, .5, .27, .8, .23);
foreShape.bezierCurveTo(.87, .14, .82, -.01, .71, -.1);
foreShape.bezierCurveTo(.55, -.2, .3, -.17, .04, -.05);
const hindShape = new THREE.Shape();
hindShape.moveTo(.02, -.02);
hindShape.bezierCurveTo(.3, .02, .55, -.06, .58, -.24);
hindShape.bezierCurveTo(.6, -.42, .42, -.52, .26, -.5);
hindShape.bezierCurveTo(.12, -.48, .04, -.32, 0, -.1);

/* Paints a violet morpho-style wing (gradient, veins, dark margin, pearl dots, eyespot)
   and returns a mesh-ready geometry + material with UVs spanning the outline. */
function makeWing(shape, hind) {
  const pts = shape.getPoints(96);
  const box = new THREE.Box2().setFromPoints(pts), size = box.getSize(new THREE.Vector2());
  const W = 1024, H = Math.round(W * size.y / size.x);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const P = (u, v) => [(u - box.min.x) / size.x * W, (1 - (v - box.min.y) / size.y) * H];
  const [rx, ry] = P(0, 0);
  const path = new Path2D();
  pts.forEach((p, i) => { const [a, b] = P(p.x, p.y); i ? path.lineTo(a, b) : path.moveTo(a, b); });
  path.closePath();
  x.save(); x.clip(path);

  const reach = Math.max(...pts.map(p => Math.hypot(...P(p.x, p.y).map((q, i) => q - [rx, ry][i]))));
  const g = x.createRadialGradient(rx, ry, 0, rx, ry, reach);
  g.addColorStop(0, "#0e0624"); g.addColorStop(.14, "#24106a"); g.addColorStop(.36, "#4b2bc4");
  g.addColorStop(.58, "#6f42f5"); g.addColorStop(.8, "#a27dff"); g.addColorStop(1, "#d9c8ff");
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  // soft highlight sweep
  const hl = x.createLinearGradient(0, H, W, 0);
  hl.addColorStop(.35, "rgba(255,255,255,0)"); hl.addColorStop(.6, "rgba(220,240,255,.22)"); hl.addColorStop(.8, "rgba(255,255,255,0)");
  x.fillStyle = hl; x.fillRect(0, 0, W, H);

  // veins radiating from the root
  const far = pts.filter(p => Math.hypot(p.x, p.y) > .45 * Math.max(...pts.map(q => Math.hypot(q.x, q.y))));
  const n = hind ? 7 : 9;
  x.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const p = far[Math.round((i + .5) / n * (far.length - 1))];
    const [ex, ey] = P(p.x * .97, p.y * .97);
    const [cx, cy] = P(p.x * .45 + p.y * .08, p.y * .45 - p.x * .05);
    x.strokeStyle = "rgba(14,6,40,.55)"; x.lineWidth = 5;
    x.beginPath(); x.moveTo(rx, ry); x.quadraticCurveTo(cx, cy, ex, ey); x.stroke();
  }
  // a couple of cross veins
  x.strokeStyle = "rgba(14,6,40,.35)"; x.lineWidth = 3;
  x.beginPath();
  far.forEach((p, i) => { const [a, b] = P(p.x * .62, p.y * .62); i ? x.lineTo(a, b) : x.moveTo(a, b); });
  x.stroke();

  // dark margin following the outline
  x.lineJoin = "round";
  x.strokeStyle = "#120826"; x.lineWidth = hind ? 64 : 72; x.stroke(path);

  // pearl dots inside the margin
  const edge = shape.getSpacedPoints(hind ? 26 : 30).filter(p => Math.hypot(p.x, p.y) > .3);
  for (const p of edge) {
    const [a, b] = P(p.x * .955, p.y * .955 + (p.y < 0 ? .012 : -.012));
    x.fillStyle = "rgba(255,250,255,.92)";
    x.beginPath(); x.arc(a, b, 7, 0, Math.PI * 2); x.fill();
  }

  // eyespot on the hindwing, pale apex patch on the forewing
  if (hind) {
    const [a, b] = P(.36, -.3);
    [[44, "#100720"], [36, "#ffb347"], [24, "#100720"], [12, "#7d5cff"]].forEach(([r, col]) => { x.fillStyle = col; x.beginPath(); x.arc(a, b, r, 0, Math.PI * 2); x.fill(); });
    x.fillStyle = "#fff"; x.beginPath(); x.arc(a - 6, b - 6, 5, 0, Math.PI * 2); x.fill();
  } else {
    const [a, b] = P(.66, .14);
    const sp = x.createRadialGradient(a, b, 0, a, b, 90);
    sp.addColorStop(0, "rgba(255,255,255,.85)"); sp.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = sp; x.beginPath(); x.arc(a, b, 90, 0, Math.PI * 2); x.fill();
  }
  x.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const geo = new THREE.ShapeGeometry(shape, 32);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) - box.min.x) / size.x, (pos.getY(i) - box.min.y) / size.y);
  geo.rotateX(-Math.PI / 2); geo.rotateY(-Math.PI / 2); // outward -> +Z, forward -> +X
  const mat = new THREE.MeshPhysicalMaterial({
    map: tex, side: THREE.DoubleSide, roughness: .38, metalness: .05,
    iridescence: 1, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 520],
    emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: .14
  });
  return { geo, mat };
}

const bodyMat = new THREE.MeshPhysicalMaterial({ color: 0x1d1236, roughness: .6, sheen: 1, sheenColor: new THREE.Color(0x9a7bff), sheenRoughness: .45 });
const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x0b0614, roughness: .15, clearcoat: 1 });
const V = (a, b, c) => new THREE.Vector3(a, b, c);
const part = (geo, mat, p = [0, 0, 0], s) => { const m = new THREE.Mesh(geo, mat); m.position.set(...p); if (s) m.scale.set(...s); body.add(m); return m; };
part(new THREE.SphereGeometry(.06, 32, 20), bodyMat, [.02, 0, 0], [1.5, 1, 1]);   // thorax
part(new THREE.SphereGeometry(.042, 24, 16), bodyMat, [.12, .005, 0]);            // head
const abdomen = new THREE.LatheGeometry(Array.from({ length: 16 }, (_, i) => {
  const t = i / 15; return new THREE.Vector2(.04 * Math.sin(Math.PI * (.12 + .88 * t)) ** .8, t * .34);
}), 24);
abdomen.rotateZ(Math.PI / 2);
part(abdomen, bodyMat, [-.04, -.005, 0]);
for (const s of [1, -1]) {
  part(new THREE.SphereGeometry(.022, 16, 12), eyeMat, [.14, .016, .028 * s]);
  part(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(.15, .03, .015 * s), V(.26, .12, .05 * s), V(.37, .19, .1 * s)]), 24, .0045, 6), bodyMat);
  part(new THREE.SphereGeometry(.012, 12, 8), bodyMat, [.37, .19, .1 * s], [1.7, 1, 1]);
  for (const [lx, ex] of [[.05, .11], [.02, .02], [-.01, -.08]])
    part(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(lx, -.03, .02 * s), V((lx + ex) / 2, -.075, .075 * s), V(ex, -.14, .09 * s)]), 12, .004, 5), bodyMat);
}

const fore = makeWing(foreShape, false), hind = makeWing(hindShape, true);
const flaps = [];
for (const mirror of [false, true]) {
  const side = new THREE.Group(); side.position.set(0, .04, .015);
  if (mirror) side.scale.z = -1;
  for (const [w, x0, phase] of [[fore, .01, 0], [hind, -.02, -.3]]) {
    const hinge = new THREE.Group(); hinge.position.x = x0;
    hinge.add(new THREE.Mesh(w.geo, w.mat));
    side.add(hinge); flaps.push({ g: hinge, phase });
  }
  body.add(side);
}
const loaded = true;
canvas.classList.add("ready");
document.fonts.ready.then(() => setTimeout(reveal, 300));

/* ---------- 5f. scroll-driven flight path ---------- */
const K_DESK = [
  { x: .44, y: -.24, s: 1.00, yaw: 150, pitch: 6, roll: -4 },
  { x: -.45, y: .7, s: .85, yaw: 125, pitch: 10, roll: 6 },
  { x: .5, y: .42, s: .75, yaw: 60, pitch: 6, roll: -4 },
  { x: .66, y: .30, s: .80, yaw: 40, pitch: -6, roll: -8 },
  { x: -.22, y: .02, s: .96, yaw: 160, pitch: 8, roll: 4 },
  { x: .02, y: -.08, s: .92, yaw: 105, pitch: 4, roll: 0 }
];
const K_MOB = [
  { x: .05, y: -.2, s: .6, yaw: 150, pitch: 6, roll: -4 },
  { x: -.25, y: .68, s: .5, yaw: 125, pitch: 10, roll: 6 },
  { x: .55, y: .64, s: .42, yaw: 200, pitch: 6, roll: 4 },
  { x: .55, y: .55, s: .5, yaw: 40, pitch: -6, roll: -8 },
  { x: .25, y: .20, s: .72, yaw: 160, pitch: 8, roll: 4 },
  { x: .05, y: -.18, s: .7, yaw: 105, pitch: 4, roll: 0 }
];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerpAngle = (a, b, t) => { const d = ((b - a + 540) % 360) - 180; return a + d * t; };

/* Section-aware progress: the butterfly holds while a (possibly tall) section is read
   and flies to the next spot during the last viewport-height before it.
   `hold` = how many viewport-heights have been scrolled inside a tall section before the flight starts. */
function progress() {
  const y = scrollY, tops = sections.map(s => s.offsetTop), n = tops.length;
  if (y >= tops[n - 1]) return { p: n - 1, hold: 0 };
  let i = 0;
  for (let k = 0; k < n - 1; k++) if (y >= tops[k]) i = k;
  const next = tops[i + 1], start = Math.max(tops[i], next - innerHeight);
  return {
    p: i + (y < start ? 0 : clamp((y - start) / (next - start), 0, 1)),
    hold: (Math.min(y, start) - tops[i]) / innerHeight
  };
}
function targetAt({ p, hold }) {
  const mobile = innerWidth < 760, K = mobile ? K_MOB : K_DESK;
  if (!Number.isFinite(p)) p = 0;
  p = clamp(p, 0, K.length - 1);
  const i = Math.min(K.length - 2, Math.floor(p)), f = p - i;
  const t = ease(clamp((f - .12) / .76, 0, 1));
  const a = K[i], b = K[i + 1], m = Math.sin(t * Math.PI);
  // On phones the project cards fill the screen, so the butterfly stays perched by the
  // heading and scrolls away with it, then flies back in for the next section.
  const ay = a.y + (mobile ? hold * 2 : 0);
  return {
    x: lerp(a.x, b.x, t), y: lerp(ay, b.y, t) + m * -.22, s: lerp(a.s, b.s, t) * (1 + m * .12),
    yaw: lerpAngle(a.yaw, b.yaw, t), pitch: lerp(a.pitch, b.pitch, t), roll: lerp(a.roll, b.roll, t), moving: m
  };
}

/* ---------- 5g. loop ---------- */
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
addEventListener("pointermove", e => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = -(e.clientY / innerHeight * 2 - 1); }, { passive: true });
const clock = new THREE.Clock();
const cur = { ...targetAt(progress()) };
const D = Math.PI / 180;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
  const tg = targetAt(progress());
  const k = 1 - Math.exp(-dt * 3.2), ky = 1 - Math.exp(-dt * 2.6);
  const px = cur.x, py = cur.y;
  for (const q of ["x", "y", "s", "pitch", "roll"]) cur[q] = lerp(cur[q], tg[q], k);
  cur.yaw = lerpAngle(cur.yaw, tg.yaw, ky);
  cur.moving = tg.moving;
  const vx = dt ? (cur.x - px) / dt : 0, vy = dt ? (cur.y - py) / dt : 0;
  const km = 1 - Math.exp(-dt * 2);
  mouse.sx = lerp(mouse.sx, mouse.x, km); mouse.sy = lerp(mouse.sy, mouse.y, km);

  const halfH = Math.tan(camera.fov / 2 * D) * camera.position.z, halfW = halfH * camera.aspect;
  const hover = Math.sin(time * 2.1) * .045 + Math.sin(time * 3.7) * .015;
  flight.position.set(
    cur.x * halfW + Math.sin(time * 1.3) * .04 + mouse.sx * .12,
    cur.y * halfH + hover * halfH * .5 + mouse.sy * .08,
    Math.sin(time * .9) * .15
  );
  flight.scale.setScalar(halfH * 2 * .30 * .78 * cur.s);
  heading.rotation.set(0, -(cur.yaw + mouse.sx * 12) * D, 0);
  const pitch = cur.pitch - clamp(vy * 22, -28, 28) + Math.sin(time * 2.1 + 1) * 3 + mouse.sy * 6;
  const roll = cur.roll + clamp(vx * 18, -30, 30) + Math.sin(time * 1.7) * 4;
  body.rotation.set(roll * D, 0, pitch * D, "YZX");

  // Slow, graceful wingbeats with a snappy downstroke; the body lifts on each stroke.
  const beat = Math.PI * 2 * (2.4 + cur.moving * 1.8);
  for (const f of flaps) {
    const a = Math.sin(time * beat + f.phase), sh = Math.sign(a) * Math.abs(a) ** .7;
    f.g.rotation.x = -.35 - sh * .75;
  }
  body.position.y = Math.sin(time * beat - 1.2) * .035;
  if (loaded) renderer.render(scene, camera);
}
tick();
</script>
